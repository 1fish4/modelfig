[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "modelfig"
version = "0.3.0"
description = "面向科研与数学建模的 matplotlib 绘图模板库：风格、配色、底色三者正交，一份数据多套观感"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["matplotlib", "visualization", "scientific-figures", "mathematical-modeling", "chinese-font", "plotting"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "matplotlib>=3.7",
    "numpy>=1.23",
    "pandas>=2.0",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/YOUR_NAME/modelfig"
Repository = "https://github.com/YOUR_NAME/modelfig"
"Bug Tracker" = "https://github.com/YOUR_NAME/modelfig/issues"

[tool.setuptools.packages.find]
include = ["modelfig*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
